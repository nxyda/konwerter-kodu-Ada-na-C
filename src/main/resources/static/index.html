<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ada to C Transpiler</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #1a1a1a; color: #e0e0e0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .header-title { color: #ffffff; font-weight: 700; letter-spacing: 1px; }
        .editor-wrap { display: flex; background-color: #262626; border: 1px solid #3a3a3a; border-radius: 6px; overflow: hidden; }
        .editor-wrap:focus-within { box-shadow: 0 0 0 0.25rem rgba(102, 217, 239, 0.25); border-color: #66d9ef; }
        .line-numbers { padding: 12px 8px 12px 10px; background-color: #1e1e1e; color: #555; font-family: 'Fira Code', 'Courier New', Courier, monospace; font-size: 14px; line-height: 1.5; text-align: right; user-select: none; min-width: 40px; border-right: 1px solid #3a3a3a; overflow: hidden; white-space: pre; }
        textarea { font-family: 'Fira Code', 'Courier New', Courier, monospace; background-color: #262626 !important; color: #a9dc76 !important; border: none !important; font-size: 14px; line-height: 1.5; resize: none; flex: 1; border-radius: 0 !important; padding: 12px !important; }
        textarea:focus { box-shadow: none !important; outline: none !important; }
        .output-box { background-color: #262626; border: 1px solid #3a3a3a; min-height: 432px; font-family: 'Fira Code', 'Courier New', Courier, monospace; color: #66d9ef; white-space: pre; border-radius: 6px; font-size: 14px; display: flex; overflow: auto; }
        .output-line-numbers { padding: 12px 8px 12px 10px; background-color: #1e1e1e; color: #555; font-size: 14px; line-height: 1.5; text-align: right; user-select: none; min-width: 40px; border-right: 1px solid #3a3a3a; white-space: pre; flex-shrink: 0; }
        .output-content { padding: 12px; flex: 1; white-space: pre-wrap; }
        .error-box { background-color: rgba(255, 97, 136, 0.1); border: 1px solid #ff6188; color: #ff6188; padding: 15px; margin-top: 20px; border-radius: 6px; display: none; }
        .btn-compile { background-color: #66d9ef; color: #1a1a1a; font-weight: bold; border: none; transition: 0.2s; }
        .btn-compile:hover { background-color: #a9dc76; color: #1a1a1a; }
    </style>
</head>
<body class="container py-5">

    <h1 class="text-center mb-5 header-title">Ada -> C Transpiler</h1>

    <div class="row g-4">
        <div class="col-md-6">
            <h5 class="mb-3 text-secondary">Kod źródłowy (Ada)</h5>
            <div class="editor-wrap">
                <div id="adaLineNumbers" class="line-numbers">1</div>
                <textarea id="adaCode" rows="18" placeholder="-- Wpisz swój kod w języku Ada tutaj...&#10;procedure Main is&#10;begin&#10;    null;&#10;end Main;" oninput="updateLineNumbers()" onscroll="syncScroll()" onkeydown="updateLineNumbers()"></textarea>
            </div>
            <button onclick="compileCode()" class="btn btn-compile w-100 mt-3 py-2 shadow-sm">Konwertuj do C</button>
        </div>

        <div class="col-md-6">
            <h5 class="mb-3 text-secondary">Wynik kompilacji (C)</h5>
            <div id="cOutput" class="output-box">
                <div id="cLineNumbers" class="output-line-numbers" style="color:#555"></div>
                <div id="cContent" class="output-content" style="color:#555">Oczekiwanie na kod...</div>
            </div>
        </div>
    </div>

    <div id="errorSection" class="error-box shadow">
        <h5 class="fw-bold mb-2"> Wykryte błędy semantyczne:</h5>
        <ul id="errorList" class="mb-0"></ul>
    </div>

    <script>
        function updateLineNumbers() {
            const textarea = document.getElementById('adaCode');
            const lineNumbers = document.getElementById('adaLineNumbers');
            const lineCount = textarea.value.split('\n').length;
            lineNumbers.textContent = Array.from({length: lineCount}, (_, i) => i + 1).join('\n');
        }

        function syncScroll() {
            const textarea = document.getElementById('adaCode');
            const lineNumbers = document.getElementById('adaLineNumbers');
            lineNumbers.scrollTop = textarea.scrollTop;
        }

        function setOutput(text, color) {
            const content = document.getElementById('cContent');
            const lineNumbers = document.getElementById('cLineNumbers');
            content.textContent = text;
            content.style.color = color;
            const lines = text.split('\n').length;
            lineNumbers.textContent = Array.from({length: lines}, (_, i) => i + 1).join('\n');
            lineNumbers.style.color = '#555';
        }

        async function compileCode() {
            const adaCode = document.getElementById('adaCode').value;
            const errorSection = document.getElementById('errorSection');
            const errorList = document.getElementById('errorList');

            errorSection.style.display = 'none';
            errorList.innerHTML = '';
            setOutput("Przetwarzanie...", "#888");

            try {
                const response = await fetch('/api/compile', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ code: adaCode })
                });

                const data = await response.json();

                if (data.success) {
                    setOutput(data.cCode, "#66d9ef");
                } else {
                    setOutput("/* Transpilacja przerwana z powodu błędów semantycznych */", "#ff6188");
                    errorSection.style.display = 'block';
                    data.errors.forEach(err => {
                        const li = document.createElement('li');
                        li.className = "mt-1";
                        li.innerText = err;
                        errorList.appendChild(li);
                    });
                }
            } catch (err) {
                setOutput("Błąd: Nie można połączyć się z backendem systemu. Sprawdź czy aplikacja w Javie działa.", "#ff6188");
            }
        }

        updateLineNumbers();
    </script>
</body>
</html>
